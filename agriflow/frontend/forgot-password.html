<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | AgriFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="header">
      <a class="brand-lockup brand-link" href="index.html">
        <div class="brand-mark" aria-hidden="true">AF</div>
        <div>
          <h1>AgriFlow</h1>
          <p>Farm activity and yield tracking system</p>
        </div>
      </a>
    </header>

    <main class="reset-shell">
      <section class="auth-panel reset-panel">
        <div class="reset-heading">
          <span class="reset-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img">
              <path d="M12 17v.01" />
              <path d="M7 10V8a5 5 0 0 1 10 0v2" />
              <path d="M5 10h14v10H5z" />
            </svg>
          </span>
          <div>
            <h2>Reset password</h2>
            <p>Verify your account and set a new password.</p>
          </div>
        </div>

        <form class="reset-form" onsubmit="return false;">
          <div class="form-group">
            <label for="resetEmail">Email</label>
            <input type="email" id="resetEmail" autocomplete="email" />
          </div>

          <button id="requestResetBtn" type="button">Send verification code</button>

          <div id="devCodeBox" class="code-box hidden" aria-live="polite"></div>

          <hr />

          <div class="form-group">
            <label for="verificationCode">Verification code</label>
            <input type="text" id="verificationCode" inputmode="numeric" maxlength="6" />
          </div>

          <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" placeholder="Minimum 6 characters" autocomplete="new-password" />
          </div>

          <button id="resetPasswordBtn" type="button">Change password</button>
          <a class="text-link" href="index.html">Back to login</a>
        </form>

        <p id="resetMessage" class="message" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="forgot-password.js"></script>
</body>
</html>
